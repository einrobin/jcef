name: Build Linux

on:
  push:
    branches: [ "dev", "feature/actions" ]
  pull_request:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Setup Python 3
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: 'latest'
    
    - name: Setup dependencies
      run: |
        sudo apt-get update
        sudo apt-get install ant git gcc cmake
        sudo apt-get install bison flex pkg-config libx11-dev libxext-dev libxi-dev libxtst-dev libxrender-dev

    - name: Build
      shell: bash
      run: ./jb/tools/linux/build.sh all x86_64

    - name: 'Upload Artifact'
      uses: actions/upload-artifact@v4
      with:
        name: jcef_linux_x64.tar.gz
        path: jcef_linux_x64.tar.gz

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    environment: maven-deploy
    steps:
    - uses: actions/checkout@v6
    
    - name: Download Artifact
      uses: actions/download-artifact@v7
      with:
        name: jcef_linux_x64.tar.gz
        path: .

    - name: Deploy to Maven
      env:
        MAVEN_REPO_URL: ${{ vars.MAVEN_REPO_URL }}
        MAVEN_USERNAME: ${{ secrets.MAVEN_REPO_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.MAVEN_REPO_PASSWORD }}
      run: |
        chmod +x tools/deploy_maven.sh
        VERSION=${GITHUB_REF#refs/tags/}
        ./tools/deploy_maven.sh linux x86_64 jcef_linux_x64.tar.gz "$MAVEN_REPO_URL" "$MAVEN_USERNAME" "$MAVEN_PASSWORD" "$VERSION"
