name: Build Windows

on:
  push:
    branches: [ "dev", "feature/actions", "feature/themes" ]
    tags:
      - '*'
  pull_request:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - uses: msys2/setup-msys2@v2
      id: msys2
      name: Setup MSYS2

    - name: Add MSYS2 to PATH
      shell: pwsh
      run: |
        echo "${{ steps.msys2.outputs.msys2-location }}/usr/bin" >> $env:GITHUB_PATH

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Setup Python 3
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: 'latest'

    - name: Build
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" amd64
        set "JCEF_CMAKE=C:\Program Files\CMake"
        cd jb/tools/windows
        cmd /c build.bat all x86_64

    - name: 'Upload Artifact'
      uses: actions/upload-artifact@v4
      with:
        name: jcef_win_x64.tar.gz
        path: jcef_win_x64.tar.gz

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    environment: maven-deploy
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Download Artifact
      uses: actions/download-artifact@v7
      with:
        name: jcef_win_x64.tar.gz
        path: .

    - name: Deploy to Maven
      env:
        MAVEN_REPO_URL: ${{ vars.MAVEN_REPO_URL }}
        MAVEN_USERNAME: ${{ secrets.MAVEN_REPO_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.MAVEN_REPO_PASSWORD }}
      run: |
        chmod +x tools/deploy_maven.sh
        VERSION=${GITHUB_REF#refs/tags/}
        ./tools/deploy_maven.sh windows x86_64 jcef_win_x64.tar.gz "$MAVEN_REPO_URL" "$MAVEN_USERNAME" "$MAVEN_PASSWORD" "$VERSION"
