name: Build Windows

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - uses: msys2/setup-msys2@v2
      id: msys2
      name: Setup MSYS2

    - name: Add MSYS2 to PATH
      shell: pwsh
      run: |
        echo "${{ steps.msys2.outputs.msys2-location }}/usr/bin" >> $env:GITHUB_PATH

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Setup Python 3
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Setup CMake
      uses: jwlawrence/actions-setup-cmake@v2
      with:
        cmake-version: 'latest'

    - name: Build
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" amd64
        set "JCEF_CMAKE=C:\Program Files\CMake"
        cd jb/tools/windows
        cmd /c build.bat all x86_64
